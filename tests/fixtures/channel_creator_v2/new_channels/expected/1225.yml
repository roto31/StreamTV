name: 1225 Vintage Kids Christmas
description: Chronological run (1981 -> 2005) of off-air kids Christmas broadcasts; one vintage station-break reel (alternating Minnesota WCCO/KSTP/KARE and CBS/ABC/NBC network reels) between programs,
  then long commercial reels and multi-hour marathon tapes. Loops.
