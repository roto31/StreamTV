# Channel Creator templates (§5.0). Example channel numbers are in-use only — never rebuild them.

templates:
  kids_specials:
    built_like: "1225"
    label: "Kids holiday specials"
    default_style: kids_2026
    rotation: parity_alternate
    break_groups: ["mn", "net"]
    station_id_after_each_gap: false
    long_reel_seconds: 1200
    categories: ["Holiday", "Special", "Children"]

  holiday_family:
    built_like: "101/214/401/704/1031/1128"
