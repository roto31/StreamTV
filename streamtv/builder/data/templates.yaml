    break_groups: ["mn", "net"]
    station_id_after_each_gap: false
    long_reel_seconds: 1200
    categories: ["Holiday", "Special", "Family"]

  prime_time_station_ids:
    built_like: "1224"
    label: "Prime-time movies/specials with station IDs"
    default_style: prime_2026
    rotation: interleave_wrap
    break_groups: ["WCCO", "KSTP"]
    station_id_after_each_gap: true
    long_reel_seconds: 1200
    categories: ["Holiday", "Special", "Movie"]

  custom:
    built_like: null
    label: "Custom"
    default_style: prime_2026
    rotation: interleave_wrap
    break_groups: []
