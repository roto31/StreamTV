# Demo schedule for channel 101 — copy to schedules/101.yml after import.
# Playout + XMLTV authority is this file (web schedule create/edit is retired).
# Shape matches schedules/README.md (content + sequence + playout).

name: 101 StreamTV Demo
description: Loop Big Buck Bunny for first-run onboarding.
media:
  preferred_extension: mp4
  mp4_only: true
content:
